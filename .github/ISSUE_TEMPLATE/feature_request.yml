name: Feature request
description: Suggest an idea or capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Dupin is a passive tool. Proposals that add transmitting, attacking, or
        impersonation capabilities are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware scope
      multiple: true
      options:
        - M5Stack Cardputer (ESP32-S3)
        - M5Stack Cardputer ADV (ESP32-S3)
        - Other ESP32-S3 board
        - Not hardware-specific
