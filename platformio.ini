; Dupin - Defensive Wi-Fi Intelligence Toolkit
; Target: M5Stack Cardputer / Cardputer ADV (ESP32-S3)
; 
; Build: pio run
; Upload: pio run -t upload
; Test: pio test -e native
; Monitor: pio device monitor

[platformio]
name = dupin
description = Defensive Wi-Fi Intelligence Toolkit
default_envs = cardputer

; ============================================
; Common settings for ESP32-S3 environments
; ============================================
[esp32s3_common]
; Pinned to an exact pioarduino release, by URL because pioarduino is not in the PlatformIO
; registry (ADR-0008). A bare `espressif32` resolved to whatever sat in the builder's core
; dir, which made the platform a fact about the machine rather than about the repo.
; The lineage is not interchangeable with platformio/espressif32: that one still ships
; Arduino 2.0.17, where uint32_t is `unsigned int` exactly as on the host, so the
; -Werror=format gate invariant 6 relies on stops catching the device-wrong direction.
; Changing this line means re-measuring that gate first (ADR-0008).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
lib_deps = 
    m5stack/M5Unified@^0.2.8
    m5stack/M5Cardputer@^1.1.1
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags = 
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
; printf format strings are checked as errors, on our sources only. build_src_flags
; (not build_flags) keeps this off M5Unified/M5Cardputer, whose warnings we cannot fix.
;
; -Werror=format promotes the whole format family, truncation included. The
; -Wno-error=format-truncation exemption that used to sit here is gone: it was holding
; the door for three known sites in src/main.cpp, and with those fixed its only remaining
; effect would have been to let the next one land as a warning nobody reads. Measured in
; both directions on the commit that removed it -- a deliberately undersized snprintf
; fails the build, and the tree without one is clean (ADR-0013).
;
; -Werror=switch: a switch over an enum with no `default` fails the build when a value
; goes unhandled. sessionResultMessage() depends on that to stop a new SessionResult
; shipping with no sentence for the operator, and measured without this flag a missing
; case compiled clean on both envs, so the guarantee was being claimed, not enforced
; (ADR-0019).
build_src_flags = -Wformat -Werror=format -Werror=switch

; ============================================
; M5Stack Cardputer (v1.1) - Original
; ESP32-S3 via M5StampS3A module
; ============================================
[env:cardputer]
extends = esp32s3_common
build_flags = 
    ${esp32s3_common.build_flags}
    -DDUPIN_BOARD_CARDPUTER
    -DDUPIN_HAS_DISPLAY
    -DDUPIN_HAS_KEYBOARD
    -DDUPIN_HAS_IR
    -DDUPIN_HAS_SDCARD
    ; Cardputer v1.1 specific
    -DDUPIN_HAS_SPEAKER
    -DDUPIN_HAS_MIC

; ============================================
; M5Stack Cardputer ADV - Advanced Version
; ESP32-S3FN8 via Stamp-S3A module
;
; No -DBOARD_HAS_PSRAM here, and it must not come back: the module's eFuses report
; "Embedded Flash 8MB" and no PSRAM die, so declaring PSRAM crashes the Arduino core's own
; failure path during system init -- esp_psram_init() fails, and the error path calls
; esp_timer before the systimer HAL exists. That panics at ESP_SYSTEM_INIT_FN priority 99,
; before app_main, which is why setup() never printed a line (ADR-0011).
;
; The ADV's IMU, audio codec and headphone jack get no -D: Dupin is a passive Wi-Fi
; receiver and has no driver for any of them. A macro declaring hardware nothing reads is
; a claim the build cannot keep (ADR-0011).
; ============================================
[env:cardputer_adv]
extends = esp32s3_common
build_flags = 
    ${esp32s3_common.build_flags}
    -DDUPIN_BOARD_CARDPUTER_ADV
    -DDUPIN_HAS_DISPLAY
    -DDUPIN_HAS_KEYBOARD
    -DDUPIN_HAS_IR
    -DDUPIN_HAS_SDCARD
    -DDUPIN_HAS_SPEAKER
    -DDUPIN_HAS_MIC

; ============================================
; Generic ESP32-S3 for development
; ============================================
[env:esp32s3_generic]
extends = esp32s3_common
build_flags = 
    ${esp32s3_common.build_flags}
    -DDUPIN_BOARD_GENERIC_S3

; ============================================
; Native environment for unit tests
; (No Arduino, no hardware required)
; ============================================
[env:native]
; Deliberately unpinned, and a declared gap: platform-native supplies no compiler, so this
; gate builds with whatever g++ is on PATH. The host half of invariant 6 rests on uint32_t
; being `unsigned int` there, which holds on x86-64 Linux but is not pinned here (ADR-0008).
platform = native
build_flags = 
    -std=c++17
    -DUNIT_TEST
    -DNATIVE_BUILD
    -I test/mocks
    -I src
test_framework = unity
test_build_src = true
; Same gate as the device env. The host mock's Serial.printf carries the format
; attribute the real Print::printf has, so the two builds check the same thing.
; -Werror=switch matches the device env for the same reason (ADR-0019).
build_src_flags = -Wformat -Werror=format -Werror=switch
; Exclude ESP32-specific and main files from native build
build_src_filter = 
    +<*>
    -<main.cpp>
    -<capture/wifi_capture.cpp>
lib_compat_mode = off
